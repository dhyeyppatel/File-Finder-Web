<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>File Finder</title>

  <!-- INLINE CSS: replace missing/404 static issues -->
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <header class="topbar">
    <button id="openSidebarBtn" class="hamburger" aria-label="Open menu">☰</button>
    <div class="brand">File Finder</div>

    <div class="search-area">
      <input id="searchInput" type="search" placeholder="search among 5 Lakh+ files..." autocomplete="off" />
      <button id="searchBtn">Search</button>
      <div id="suggestions" class="suggestions" style="display:none"></div>
    </div>

    <div class="theme-toggle-wrapper">
      <label class="switch">
        <input type="checkbox" id="darkToggle" aria-label="Toggle dark mode">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- overlay -->
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="sidebar-header">
      <div class="sidebar-title">Menu</div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
    </div>

    <div class="sidebar-section">
      <h3>Actions</h3>
      <button id="refreshBtn" class="sidebar-btn">
        <i>↻</i> Refresh
      </button>
      <button id="featuresBtn" class="sidebar-btn">
        <i>★</i> Features
      </button>
      <button id="howtoBtn" class="sidebar-btn">
        <i>?</i> How to use
      </button>
    </div>

    <div class="sidebar-section">
      <h3>Appearance</h3>
      <div class="theme-picker">
        <div class="theme-dot" style="background:#5e60ce" data-theme="default" title="Violet"></div>
        <div class="theme-dot" style="background:#10b981" data-theme="emerald" title="Emerald"></div>
        <div class="theme-dot" style="background:#f59e0b" data-theme="amber" title="Amber"></div>
        <div class="theme-dot" style="background:#f43f5e" data-theme="rose" title="Rose"></div>
        <div class="theme-dot" style="background:#0ea5e9" data-theme="sky" title="Sky"></div>
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:auto">
      <h3>Info</h3>
      <p style="font-size:13px; color:var(--text-muted); margin:0 0 4px 4px;">
        Developer: <a href="https://gist.github.com/dhyeyppatel"
          style="color:var(--primary); text-decoration:none; font-weight:600">Dhyey</a>
      </p>
      <p style="font-size:13px; color:var(--text-muted); margin:0 0 0 4px;">
        <a href="https://t.me/commonthread" style="color:var(--text-muted)">Common Thread</a>
      </p>
    </div>
  </aside>

  <main class="main" id="mainContent">
    <section class="controls">
      <label>Year:
        <select id="yearFilter">
          <option value="">All</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
        </select>
      </label>

      <label>Type:
        <select id="typeFilter">
          <option value="">All</option>
          <option>mp4</option>
          <option>pdf</option>
          <option>zip</option>
          <option>mkv</option>
          <option>epub</option>
        </select>
      </label>

      <label>Sort:
        <select id="sortFilter">
          <option value="desc">Newest</option>
          <option value="asc">Oldest</option>
        </select>
      </label>
    </section>

    <section id="cards" class="cards"></section>

    <div id="loading" class="loading">Loading...</div>
    <div id="endOfList" class="end">No more items.</div>
  </main>

  <footer class="site-footer">© Common Thread</footer>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- keep JS external for easier updates -->
  <script src="/static/app.js"></script>
  <script>
    // ensure sidebar initially closed (in case class not applied)
    document.getElementById('sidebar').classList.remove('open');
  </script>
</body>

</html>
